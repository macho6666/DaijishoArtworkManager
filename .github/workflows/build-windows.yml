name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "app.py"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build single EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name DaijishoArtworkManager `
            --collect-all PIL `
            --collect-all webview `
            app.py

      - name: Verify EXE
        shell: pwsh
        run: |
          Get-Item "dist\DaijishoArtworkManager.exe" | Format-List Name,Length,FullName
          if (-not (Test-Path "dist\DaijishoArtworkManager.exe")) {
            throw "EXE was not created."
          }

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: DaijishoArtworkManager-Windows
          path: dist/DaijishoArtworkManager.exe
          if-no-files-found: error
          retention-days: 30
