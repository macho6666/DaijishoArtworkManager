name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name DaijishoArtworkManager `
            --collect-all PIL `
            app.py

      - name: Download Android Platform Tools
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" `
            -OutFile "platform-tools.zip"

          Expand-Archive `
            "platform-tools.zip" `
            -DestinationPath "android-tools"

      - name: Create Portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "portable" | Out-Null

          Copy-Item `
            "dist\DaijishoArtworkManager.exe" `
            "portable\"

          Copy-Item `
            "android-tools\platform-tools\adb.exe" `
            "portable\"

          Copy-Item `
            "android-tools\platform-tools\AdbWinApi.dll" `
            "portable\"

          Copy-Item `
            "android-tools\platform-tools\AdbWinUsbApi.dll" `
            "portable\"

      - name: Verify Portable
        shell: pwsh
        run: |
          Get-ChildItem "portable"

          if (-not (Test-Path "portable\DaijishoArtworkManager.exe")) {
            throw "DaijishoArtworkManager.exe missing"
          }

          if (-not (Test-Path "portable\adb.exe")) {
            throw "adb.exe missing"
          }

          if (-not (Test-Path "portable\AdbWinApi.dll")) {
            throw "AdbWinApi.dll missing"
          }

          if (-not (Test-Path "portable\AdbWinUsbApi.dll")) {
            throw "AdbWinUsbApi.dll missing"
          }

      - name: Upload Portable
        uses: actions/upload-artifact@v4
        with:
          name: DaijishoArtworkManager-Windows-Portable
          path: portable/
          if-no-files-found: error
          retention-days: 30
